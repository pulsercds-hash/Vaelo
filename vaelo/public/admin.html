<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel · Vaelo</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header id="barra" class="barra"><div class="contenedor"><a href="/" class="marca">vaelo</a></div></header>
  <main class="area">
    <div class="contenedor">
      <div class="area-cabecera">
        <div><h1>Panel de Vaelo</h1><p>Pedidos, clientes y tarifas.</p></div>
        <button class="boton borde chico" type="button" id="refrescar">Actualizar</button>
      </div>

      <div class="cifras" id="cifras"></div>

      <div class="pestanas" role="tablist">
        <button role="tab" id="tab-envios" aria-selected="true" aria-controls="panel-envios">Envíos</button>
        <button role="tab" id="tab-clientes" aria-selected="false" aria-controls="panel-clientes">Clientes</button>
        <button role="tab" id="tab-tarifas" aria-selected="false" aria-controls="panel-tarifas">Tarifas y ajustes</button>
      </div>

      <section id="panel-envios" role="tabpanel" aria-labelledby="tab-envios">
        <div class="filtros">
          <label class="oculto" for="buscar">Buscar</label>
          <input id="buscar" type="search" placeholder="Buscar por guía, nombre o teléfono">
          <div id="chips" style="display:flex;gap:.4rem;flex-wrap:wrap"></div>
        </div>
        <div class="tabla-envoltura">
          <table>
            <thead><tr><th>Guía</th><th>Fecha</th><th>Cliente</th><th>Entrega</th><th>Precio</th><th>Estado</th></tr></thead>
            <tbody id="tabla-envios"></tbody>
          </table>
        </div>
      </section>

      <section id="panel-clientes" role="tabpanel" aria-labelledby="tab-clientes" hidden>
        <div class="tabla-envoltura">
          <table>
            <thead><tr><th>Nombre</th><th>Correo</th><th>Teléfono</th><th>Envíos</th><th>Registro</th></tr></thead>
            <tbody id="tabla-clientes"></tbody>
          </table>
        </div>
      </section>

      <section id="panel-tarifas" role="tabpanel" aria-labelledby="tab-tarifas" hidden>
        <div id="msg-tarifas" class="mensaje" role="alert"></div>
        <div class="bloque">
          <h2>Precio por zona de entrega</h2>
          <p style="color:var(--suave)">Este es el precio base de un paquete pequeño. Desactiva una zona para dejar de ofrecerla.</p>
          <div class="tabla-envoltura" style="margin-bottom:1rem">
            <table>
              <thead><tr><th>Zona</th><th style="width:140px">Precio ($)</th><th style="width:110px">Activa</th><th style="width:110px"></th></tr></thead>
              <tbody id="tabla-zonas"></tbody>
            </table>
          </div>
          <form id="form-zona" class="fila" style="align-items:end" novalidate>
            <div class="campo"><label for="zona-nombre">Nueva zona</label><input id="zona-nombre" maxlength="80" placeholder="Ej. Nuevo Cuscatlán"></div>
            <div class="campo"><label for="zona-precio">Precio ($)</label><input id="zona-precio" type="number" min="0" step="0.25" inputmode="decimal"></div>
            <div class="campo"><button class="boton" type="submit">Agregar zona</button></div>
          </form>
        </div>
        <form class="bloque" id="form-ajustes" novalidate>
          <h2>Recargos y contacto</h2>
          <div class="fila">
            <div class="campo"><label for="recargo_mediano">Recargo paquete mediano ($)</label><input id="recargo_mediano" type="number" min="0" step="0.25"></div>
            <div class="campo"><label for="recargo_grande">Recargo paquete grande ($)</label><input id="recargo_grande" type="number" min="0" step="0.25"></div>
          </div>
          <div class="fila">
            <div class="campo"><label for="whatsapp">WhatsApp de la empresa <span class="ayuda">Con código de país, ej. 50370000000</span></label><input id="whatsapp" type="tel" maxlength="15"></div>
            <div class="campo"><label for="horario">Horario de atención</label><input id="horario" maxlength="120"></div>
          </div>
          <button class="boton" type="submit">Guardar ajustes</button>
        </form>
      </section>
    </div>
  </main>

  <dialog id="dlg"><div class="dialogo" id="dlg-cuerpo"></div></dialog>

  <script src="/js/comun.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    let filtroEstado = '';
    let temporizador = null;

    const tabs = ['envios', 'clientes', 'tarifas'];
    function abrirTab(nombre) {
      tabs.forEach(t => {
        $('tab-' + t).setAttribute('aria-selected', String(t === nombre));
        $('panel-' + t).hidden = t !== nombre;
      });
      if (nombre === 'clientes') cargarClientes();
      if (nombre === 'tarifas') cargarTarifas();
    }
    tabs.forEach(t => $('tab-' + t).addEventListener('click', () => abrirTab(t)));

    async function cargarResumen() {
      const r = await api('/api/admin/resumen');
      const c = (titulo, valor, destacada) => el('div', { class: 'cifra' + (destacada ? ' destacada' : '') }, el('span', { text: titulo }), el('strong', { text: valor }));
      $('cifras').replaceChildren(
        c('Por recoger', r.porEstado.pendiente, r.porEstado.pendiente > 0),
        c('Recogidos', r.porEstado.recogido),
        c('En camino', r.porEstado.en_camino),
        c('Pedidos hoy', r.hoy),
        c('Entregados este mes', r.entregadosMes),
        c('Ingresos del mes', dinero(r.ingresosMes)),
        c('Clientes', r.clientes));
    }

    function pintarChips() {
      const opciones = [['', 'Todos'], ...Object.entries(ESTADOS)];
      $('chips').replaceChildren(...opciones.map(([v, t]) => el('button', {
        class: 'chip', type: 'button', 'aria-pressed': String(v === filtroEstado), text: v === 'pendiente' ? 'Por recoger' : t,
        onclick: () => { filtroEstado = v; pintarChips(); cargarEnvios(); },
      })));
    }

    async function cargarEnvios() {
      const q = new URLSearchParams();
      if (filtroEstado) q.set('estado', filtroEstado);
      if ($('buscar').value.trim()) q.set('q', $('buscar').value.trim());
      const cuerpo = $('tabla-envios');
      try {
        const { envios } = await api('/api/admin/envios?' + q);
        if (!envios.length) {
          cuerpo.replaceChildren(el('tr', {}, el('td', { colspan: 6, style: 'text-align:center;color:var(--suave);padding:2rem', text: 'No hay envíos con este filtro.' })));
          return;
        }
        cuerpo.replaceChildren(...envios.map(e => el('tr', { class: 'clic', tabindex: 0,
          onclick: () => abrirEnvio(e.id), onkeydown: (ev) => { if (ev.key === 'Enter') abrirEnvio(e.id); } },
          el('td', {}, el('strong', { text: e.guia })),
          el('td', { text: fecha(e.creado) }),
          el('td', {}, e.cliente_nombre, el('br'), el('small', { style: 'color:var(--suave)', text: e.cliente_telefono || '' })),
          el('td', {}, e.destino_nombre, el('br'), el('small', { style: 'color:var(--suave)', text: e.destino_zona || '' })),
          el('td', { text: dinero(e.precio) }),
          el('td', {}, chipEstado(e.estado)))));
      } catch (e) { cuerpo.replaceChildren(el('tr', {}, el('td', { colspan: 6, class: 'mensaje error', text: e.message }))); }
    }

    async function abrirEnvio(id) {
      const { envio: e, eventos } = await api('/api/admin/envios/' + id);
      const msg = el('div', { class: 'mensaje', role: 'alert' });
      const selEstado = el('select', { id: 'nuevo-estado' }, Object.entries(ESTADOS).map(([v, t]) => el('option', { value: v, text: t, selected: v === e.estado })));
      const nota = el('input', { id: 'nota-estado', maxlength: 300, placeholder: 'Ej. Lo lleva el motorista Carlos' });
      const dato = (t, v) => el('div', {}, el('span', { text: t }), v || '—');
      $('dlg-cuerpo').replaceChildren(
        el('button', { class: 'cerrar no-imprimir', type: 'button', 'aria-label': 'Cerrar', text: '×', onclick: () => $('dlg').close() }),
        el('div', { class: 'no-imprimir' },
          el('h2', { style: 'font-size:1.4rem;margin-bottom:.3rem', text: e.guia }), chipEstado(e.estado),
          el('div', { class: 'datos' },
            dato('Cliente', `${e.cliente_nombre} (${e.cliente_telefono || e.cliente_email})`),
            dato('Precio', `${dinero(e.precio)}, ${PAGOS[e.metodo_pago] || e.metodo_pago}`),
            dato('Recoger en', `${e.origen_direccion} (${e.origen_zona || ''}). Tel. ${e.origen_telefono}`),
            dato('Entregar a', `${e.destino_nombre}, tel. ${e.destino_telefono}. ${e.destino_direccion} (${e.destino_zona || ''})`),
            dato('Paquete', `${TAMANOS[e.tamano]}${e.descripcion ? ': ' + e.descripcion : ''}`),
            dato('Cobrar al recibir', Number(e.cobro_destinatario) > 0 ? dinero(e.cobro_destinatario) : 'No'),
            e.notas ? dato('Indicaciones', e.notas) : null),
          el('div', { class: 'bloque', style: 'background:var(--gris);border:0' },
            el('h3', { text: 'Cambiar estado' }), msg,
            el('div', { class: 'fila' },
              el('div', { class: 'campo' }, el('label', { for: 'nuevo-estado', text: 'Nuevo estado' }), selEstado),
              el('div', { class: 'campo' }, el('label', { for: 'nota-estado' }, 'Nota ', el('span', { class: 'ayuda', text: 'El cliente la ve en el rastreo' })), nota)),
            el('button', { class: 'boton', type: 'button', text: 'Guardar estado', onclick: async (ev) => {
              ev.target.disabled = true;
              try {
                await api(`/api/admin/envios/${e.id}/estado`, { body: { estado: selEstado.value, nota: nota.value } });
                $('dlg').close(); cargarEnvios(); cargarResumen();
              } catch (err) { mostrarMensaje(msg, err.message); ev.target.disabled = false; }
            } })),
          el('h3', { style: 'margin-top:1.25rem', text: 'Historial' }),
          el('ol', { class: 'linea-tiempo' }, eventos.slice().reverse().map(ev =>
            el('li', {}, el('strong', { text: ESTADOS[ev.estado] || ev.estado }), ev.nota ? el('div', { text: ev.nota }) : null, el('small', { text: fecha(ev.creado) })))),
          el('details', { style: 'margin-top:1rem' }, el('summary', { text: 'Ver guía para imprimir' }))),
        el('div', { id: 'zona-guia', style: 'margin-top:.75rem' }));
      const det = $('dlg-cuerpo').querySelector('details');
      det.append(el('div', { style: 'margin-top:.75rem' }, el('button', { class: 'boton borde chico', type: 'button', text: 'Imprimir guía', onclick: () => {
        $('zona-guia').replaceChildren(guiaImprimible(e)); window.print(); $('zona-guia').replaceChildren();
      } })));
      $('dlg').showModal();
    }

    async function cargarClientes() {
      const { clientes } = await api('/api/admin/clientes');
      $('tabla-clientes').replaceChildren(...clientes.map(c => el('tr', {},
        el('td', {}, c.nombre, c.rol === 'admin' ? el('small', { style: 'color:var(--suave)', text: ' (administrador)' }) : null),
        el('td', {}, el('a', { href: 'mailto:' + c.email, text: c.email })),
        el('td', {}, c.telefono ? el('a', { href: 'https://wa.me/503' + c.telefono.replace(/\D/g, '').slice(-8), target: '_blank', rel: 'noopener', text: c.telefono }) : '—'),
        el('td', { text: c.envios }),
        el('td', { text: fecha(c.creado, false) }))));
    }

    async function cargarTarifas() {
      const { zonas, ajustes } = await api('/api/admin/zonas');
      $('tabla-zonas').replaceChildren(...zonas.map(z => {
        const nombre = el('input', { value: z.nombre, maxlength: 80, 'aria-label': 'Nombre de la zona' });
        const precio = el('input', { type: 'number', min: 0, step: 0.25, value: z.precio.toFixed(2), 'aria-label': 'Precio' });
        const activa = el('input', { type: 'checkbox', checked: !!z.activa, style: 'width:auto', 'aria-label': 'Zona activa' });
        return el('tr', {}, el('td', {}, nombre), el('td', {}, precio), el('td', {}, activa),
          el('td', {}, el('button', { class: 'boton borde chico', type: 'button', text: 'Guardar', onclick: async () => {
            try {
              await api('/api/admin/zonas/' + z.id, { method: 'PUT', body: { nombre: nombre.value, precio: precio.value, activa: activa.checked } });
              mostrarMensaje($('msg-tarifas'), `Zona "${nombre.value}" guardada.`, 'exito');
            } catch (e) { mostrarMensaje($('msg-tarifas'), e.message); }
          } })));
      }));
      for (const k of ['recargo_mediano', 'recargo_grande', 'whatsapp', 'horario']) $(k).value = ajustes[k] || '';
    }

    $('form-zona').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      try {
        await api('/api/admin/zonas', { body: { nombre: $('zona-nombre').value, precio: $('zona-precio').value } });
        ev.target.reset();
        mostrarMensaje($('msg-tarifas'), 'Zona agregada.', 'exito');
        cargarTarifas();
      } catch (e) { mostrarMensaje($('msg-tarifas'), e.message); }
    });

    $('form-ajustes').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      try {
        await api('/api/admin/ajustes', { method: 'PUT', body: {
          recargo_mediano: $('recargo_mediano').value, recargo_grande: $('recargo_grande').value,
          whatsapp: $('whatsapp').value, horario: $('horario').value } });
        mostrarMensaje($('msg-tarifas'), 'Ajustes guardados.', 'exito');
      } catch (e) { mostrarMensaje($('msg-tarifas'), e.message); }
    });

    $('buscar').addEventListener('input', () => { clearTimeout(temporizador); temporizador = setTimeout(cargarEnvios, 300); });
    $('refrescar').addEventListener('click', () => { cargarResumen(); cargarEnvios(); });

    (async () => {
      const usuario = await pintarBarra();
      if (!usuario) { location.href = '/entrar'; return; }
      if (usuario.rol !== 'admin') { location.href = '/mi-cuenta'; return; }
      pintarChips();
      cargarResumen();
      cargarEnvios();
    })();
  </script>
</body>
</html>
