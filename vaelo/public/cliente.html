<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis envíos · Vaelo</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header id="barra" class="barra"><div class="contenedor"><a href="/" class="marca">vaelo</a></div></header>
  <main class="area">
    <div class="contenedor">
      <div class="area-cabecera">
        <div><h1 id="saludo">Mis envíos</h1><p>Pide un envío nuevo o revisa en qué van los tuyos.</p></div>
      </div>

      <div class="pestanas" role="tablist">
        <button role="tab" id="tab-nuevo" aria-selected="true" aria-controls="panel-nuevo">Pedir envío</button>
        <button role="tab" id="tab-lista" aria-selected="false" aria-controls="panel-lista">Mis envíos <span id="conteo"></span></button>
        <button role="tab" id="tab-cuenta" aria-selected="false" aria-controls="panel-cuenta">Mi cuenta</button>
      </div>

      <section id="panel-nuevo" role="tabpanel" aria-labelledby="tab-nuevo">
        <form id="form-envio" class="bloque" novalidate>
          <div id="msg-envio" class="mensaje" role="alert"></div>
          <fieldset>
            <legend>¿Dónde recogemos?</legend>
            <div class="fila">
              <div class="campo"><label for="origen_zona_id">Zona</label><select id="origen_zona_id" required></select></div>
              <div class="campo"><label for="origen_telefono">Teléfono de contacto</label><input id="origen_telefono" type="tel" maxlength="30"></div>
            </div>
            <div class="campo"><label for="origen_direccion">Dirección exacta <span class="ayuda">Colonia, calle, número de casa y un punto de referencia</span></label><textarea id="origen_direccion" required maxlength="300"></textarea></div>
          </fieldset>

          <fieldset>
            <legend>¿A quién se lo entregamos?</legend>
            <div class="fila">
              <div class="campo"><label for="destino_nombre">Nombre de quien recibe</label><input id="destino_nombre" required maxlength="100"></div>
              <div class="campo"><label for="destino_telefono">Teléfono de quien recibe</label><input id="destino_telefono" type="tel" required maxlength="30"></div>
            </div>
            <div class="fila">
              <div class="campo"><label for="destino_zona_id">Zona de entrega</label><select id="destino_zona_id" required></select></div>
            </div>
            <div class="campo"><label for="destino_direccion">Dirección de entrega <span class="ayuda">Colonia, calle, número de casa y un punto de referencia</span></label><textarea id="destino_direccion" required maxlength="300"></textarea></div>
          </fieldset>

          <fieldset>
            <legend>El paquete</legend>
            <div class="campo">
              <div class="opciones" role="radiogroup" aria-label="Tamaño del paquete">
                <label class="opcion"><input type="radio" name="tamano" value="pequeno" checked><span>Pequeño<small>Sobre o cajita</small></span></label>
                <label class="opcion"><input type="radio" name="tamano" value="mediano"><span>Mediano<small>Caja de zapatos</small></span></label>
                <label class="opcion"><input type="radio" name="tamano" value="grande"><span>Grande<small>Cabe en la caja de la moto</small></span></label>
              </div>
            </div>
            <div class="fila">
              <div class="campo"><label for="descripcion">¿Qué contiene? <span class="ayuda">Opcional</span></label><input id="descripcion" maxlength="200" placeholder="Ropa, documentos, accesorios…"></div>
              <div class="campo"><label for="cobro_destinatario">Cobrar a quien recibe <span class="ayuda">Si vendes en línea; deja vacío si no aplica</span></label><input id="cobro_destinatario" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00"></div>
            </div>
            <div class="campo"><label for="notas">Indicaciones para el motorista <span class="ayuda">Opcional</span></label><input id="notas" maxlength="300" placeholder="Llamar al llegar, entregar en portería…"></div>
          </fieldset>

          <fieldset>
            <legend>¿Cómo pagas el envío?</legend>
            <div class="opciones" role="radiogroup" aria-label="Método de pago">
              <label class="opcion"><input type="radio" name="metodo_pago" value="efectivo" checked><span>Efectivo<small>Al motorista</small></span></label>
              <label class="opcion"><input type="radio" name="metodo_pago" value="transferencia"><span>Transferencia<small>Te enviamos los datos</small></span></label>
            </div>
          </fieldset>

          <div class="resumen-precio"><span>Precio del envío</span><strong id="precio" aria-live="polite">—</strong></div>
          <button class="boton" type="submit">Pedir envío</button>
        </form>
      </section>

      <section id="panel-lista" role="tabpanel" aria-labelledby="tab-lista" hidden>
        <div id="lista" class="lista-envios"></div>
      </section>

      <section id="panel-cuenta" role="tabpanel" aria-labelledby="tab-cuenta" hidden>
        <div class="bloque" id="datos-cuenta"></div>
        <form class="bloque" id="form-pass" novalidate>
          <h2>Cambiar contraseña</h2>
          <div id="msg-pass" class="mensaje" role="alert"></div>
          <div class="fila">
            <div class="campo"><label for="actual">Contraseña actual</label><input id="actual" type="password" autocomplete="current-password"></div>
            <div class="campo"><label for="nueva">Nueva contraseña <span class="ayuda">Mínimo 8 caracteres</span></label><input id="nueva" type="password" autocomplete="new-password"></div>
          </div>
          <button class="boton" type="submit">Guardar contraseña</button>
        </form>
      </section>
    </div>
  </main>

  <dialog id="dlg"><div class="dialogo" id="dlg-cuerpo"></div></dialog>

  <script src="/js/comun.js"></script>
  <script>
    let cfg = null;
    let envios = [];
    const $ = (id) => document.getElementById(id);

    // Pestañas
    const tabs = ['nuevo', 'lista', 'cuenta'];
    function abrirTab(nombre) {
      tabs.forEach(t => {
        $('tab-' + t).setAttribute('aria-selected', String(t === nombre));
        $('panel-' + t).hidden = t !== nombre;
      });
      if (nombre === 'lista') cargarEnvios();
    }
    tabs.forEach(t => $('tab-' + t).addEventListener('click', () => abrirTab(t)));

    function precioActual() {
      const z = cfg && cfg.zonas.find(z => String(z.id) === $('destino_zona_id').value);
      const t = document.querySelector('input[name="tamano"]:checked').value;
      $('precio').textContent = z ? dinero(z.precio + (cfg.recargos[t] || 0)) : 'Elige la zona de entrega';
    }

    function tarjetaEnvio(e) {
      const acciones = el('div', { class: 'acciones' },
        el('button', { class: 'boton borde chico', type: 'button', text: 'Ver guía', onclick: () => verGuia(e) }),
        el('a', { class: 'boton borde chico', href: '/rastreo?guia=' + encodeURIComponent(e.guia), text: 'Seguimiento' }));
      if (e.estado === 'pendiente') {
        acciones.append(el('button', { class: 'boton peligro chico', type: 'button', text: 'Cancelar envío', onclick: async (ev) => {
          if (!confirm(`¿Cancelar el envío ${e.guia}?`)) return;
          ev.target.disabled = true;
          try { await api(`/api/envios/${e.id}/cancelar`, { body: {} }); cargarEnvios(); }
          catch (err) { alert(err.message); ev.target.disabled = false; }
        } }));
      }
      return el('article', { class: 'envio' },
        el('div', {},
          el('div', { class: 'guia', text: e.guia }),
          el('div', { class: 'detalle', text: `Para ${e.destino_nombre}, ${e.destino_zona || ''}` }),
          el('div', { class: 'detalle', text: fecha(e.creado) })),
        el('div', { class: 'lado' }, chipEstado(e.estado), el('strong', { text: dinero(e.precio) })),
        acciones);
    }

    async function cargarEnvios() {
      const lista = $('lista');
      try {
        envios = (await api('/api/envios')).envios;
        $('conteo').textContent = envios.length ? `(${envios.length})` : '';
        if (!envios.length) {
          lista.replaceChildren(el('div', { class: 'vacio' },
            el('p', { text: 'Todavía no has pedido envíos.' }),
            el('button', { class: 'boton', type: 'button', text: 'Pedir mi primer envío', onclick: () => abrirTab('nuevo') })));
        } else lista.replaceChildren(...envios.map(tarjetaEnvio));
      } catch (e) { lista.replaceChildren(el('div', { class: 'mensaje error', text: e.message })); }
    }

    function verGuia(e) {
      const cuerpo = $('dlg-cuerpo');
      cuerpo.replaceChildren(
        el('button', { class: 'cerrar no-imprimir', type: 'button', 'aria-label': 'Cerrar', text: '×', onclick: () => $('dlg').close() }),
        el('h2', { class: 'no-imprimir', style: 'font-size:1.3rem', text: 'Tu guía de envío' }),
        el('p', { class: 'no-imprimir', style: 'color:var(--suave)', text: 'Imprímela y pégala en el paquete, o anota el número de guía en la caja.' }),
        guiaImprimible({ ...e, cliente_nombre: e.cliente_nombre }),
        el('div', { class: 'no-imprimir', style: 'margin-top:1rem;display:flex;gap:.5rem' },
          el('button', { class: 'boton', type: 'button', text: 'Imprimir guía', onclick: () => window.print() }),
          el('button', { class: 'boton borde', type: 'button', text: 'Cerrar', onclick: () => $('dlg').close() })));
      $('dlg').showModal();
    }

    $('form-envio').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const f = ev.target;
      const boton = f.querySelector('button[type="submit"]');
      boton.disabled = true;
      try {
        const r = await api('/api/envios', { body: {
          origen_zona_id: f.origen_zona_id.value, origen_telefono: f.origen_telefono.value, origen_direccion: f.origen_direccion.value,
          destino_nombre: f.destino_nombre.value, destino_telefono: f.destino_telefono.value,
          destino_zona_id: f.destino_zona_id.value, destino_direccion: f.destino_direccion.value,
          tamano: f.tamano.value, descripcion: f.descripcion.value, notas: f.notas.value,
          cobro_destinatario: f.cobro_destinatario.value, metodo_pago: f.metodo_pago.value,
        } });
        ['destino_nombre', 'destino_telefono', 'destino_direccion', 'descripcion', 'notas', 'cobro_destinatario'].forEach(k => { f[k].value = ''; });
        mostrarMensaje($('msg-envio'), '');
        await cargarEnvios();
        abrirTab('lista');
        const nuevo = envios.find(x => x.guia === r.guia);
        if (nuevo) verGuia(nuevo);
      } catch (e) { mostrarMensaje($('msg-envio'), e.message); }
      boton.disabled = false;
    });

    $('form-pass').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const f = ev.target;
      try {
        await api('/api/cambiar-password', { body: { actual: f.actual.value, nueva: f.nueva.value } });
        f.reset();
        mostrarMensaje($('msg-pass'), 'Contraseña actualizada.', 'exito');
      } catch (e) { mostrarMensaje($('msg-pass'), e.message); }
    });

    (async () => {
      const usuario = await pintarBarra();
      if (!usuario) { location.href = '/entrar'; return; }
      $('saludo').textContent = `Hola, ${usuario.nombre.split(' ')[0]}`;
      $('origen_telefono').value = usuario.telefono || '';
      $('datos-cuenta').replaceChildren(el('h2', { text: 'Tus datos' }),
        el('div', { class: 'datos' },
          el('div', {}, el('span', { text: 'Nombre' }), usuario.nombre),
          el('div', {}, el('span', { text: 'Correo' }), usuario.email),
          el('div', {}, el('span', { text: 'Teléfono' }), usuario.telefono || 'Sin teléfono')));
      cfg = await api('/api/config');
      const opciones = () => [el('option', { value: '', text: 'Elige una zona' }), ...cfg.zonas.map(z => el('option', { value: z.id, text: z.nombre }))];
      $('origen_zona_id').replaceChildren(...opciones());
      $('destino_zona_id').replaceChildren(...cfg.zonas.map(z => el('option', { value: z.id, text: `${z.nombre} — ${dinero(z.precio)}` })));
      $('destino_zona_id').prepend(el('option', { value: '', text: 'Elige una zona', selected: true }));
      $('destino_zona_id').value = '';
      $('destino_zona_id').addEventListener('change', precioActual);
      document.querySelectorAll('input[name="tamano"]').forEach(r => r.addEventListener('change', precioActual));
      precioActual();
      cargarEnvios();
    })();
  </script>
</body>
</html>
